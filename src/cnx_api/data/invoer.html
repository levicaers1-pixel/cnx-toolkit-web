<html lang="nl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNX Toolkit: invoer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Plan: werkbank voor netwerkengineers. Links de lijst switches, rechts het formulier per switch.
   Waarden die een toestel moet krijgen staan in mono, alles wat fout is krijgt een rode streep. */
:root {
  --paper: #f4f6f8;
  --panel: #ffffff;
  --ink: #17202b;
  --muted: #5b6878;
  --line: #d9dfe6;
  --accent: #1f5fd1;
  --accent-soft: #e6eefc;
  --bad: #c4312b;
  --bad-soft: #fdecea;
  --warn: #a8620a;
  --warn-soft: #fdf3e2;
  --ok: #217a4a;
  --ok-soft: #e5f4ec;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10151b; --panel: #171e26; --ink: #e4e9ef; --muted: #93a1b1; --line: #2a3440;
    --accent: #6c9dff; --accent-soft: #1b2a45; --bad: #ff7b72; --bad-soft: #3a1d1c;
    --warn: #e7a547; --warn-soft: #362a17; --ok: #5cc98d; --ok-soft: #173225; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10151b; --panel: #171e26; --ink: #e4e9ef; --muted: #93a1b1; --line: #2a3440;
  --accent: #6c9dff; --accent-soft: #1b2a45; --bad: #ff7b72; --bad-soft: #3a1d1c;
  --warn: #e7a547; --warn-soft: #362a17; --ok: #5cc98d; --ok-soft: #173225; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top h1 { font: 600 19px/1 var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.tabs { display: flex; gap: 2px; background: var(--paper); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 3px 8px; font-size: 12.5px; }

main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; }

/* Formulier */
aside.list { width: 300px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.list-tools { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.list-tools input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.chips { display: flex; gap: 6px; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.items { overflow-y: auto; flex: 1; }
.item { display: grid; grid-template-columns: 4px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0; }
.item:hover { background: var(--paper); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item .stripe { align-self: stretch; border-radius: 0 2px 2px 0; }
.item .stripe.bad { background: var(--bad); }
.item .stripe.warn { background: var(--warn); }
.item .stripe.ok { background: var(--ok); }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

section.editor { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.editor-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 16px; }
.editor-head h2 { font: 600 22px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.editor-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; max-width: 980px; }
.group h3 { margin: 0 0 2px; font: 600 14px/1.3 var(--font-body); }
.group .gdesc { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 18px; }
.field { display: grid; gap: 4px; align-content: start; }
.field label { font-weight: 500; font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.field label .alias { color: var(--muted); font: 400 11.5px var(--font-mono); }
.field .ctl { display: flex; gap: 6px; }
.field input, .field select, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 0; }
.field input.mono { font-family: var(--font-mono); }
.field.has-bad input, .field.has-bad select { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.field.has-warn input, .field.has-warn select { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.field .help { color: var(--muted); font-size: 12px; }
.field .msg { font-size: 12px; font-weight: 500; }
.field .msg.bad { color: var(--bad); }
.field .msg.warn { color: var(--warn); }
.toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 0 10px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.toggle[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }


.empty { color: var(--muted); padding: 40px; text-align: center; max-width: 520px; margin: 0 auto; }

/* Tabel */
.table-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 16px; gap: 10px; }
.table-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.table-tools input[type="search"] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 260px; max-width: 100%; }
.grid-scroll { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
table.grid th { position: sticky; top: 0; background: var(--panel); z-index: 1; text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 2px 3px; border-bottom: 1px solid var(--line); }
table.grid td.st { width: 6px; padding: 0; }
table.grid td.st.bad { background: var(--bad); }
table.grid td.st.warn { background: var(--warn); }
table.grid input, table.grid select { border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 4px; width: 100%; min-width: 120px; }
table.grid input.mono { min-width: 175px; }
table.grid td:last-child { position: sticky; right: 0; background: var(--panel); }
table.grid input:hover, table.grid select:hover { border-color: var(--line); }
table.grid input.bad, table.grid select.bad { border-color: var(--bad); background: var(--bad-soft); }
table.grid input.warn { border-color: var(--warn); background: var(--warn-soft); }
.bulk { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.bulk .bulk-label { color: var(--muted); }
.bulk .inline { display: inline-flex; gap: 6px; align-items: center; }
.bulk input { width: auto !important; padding: 4px 8px !important; }
.pager { display: flex; gap: 8px; align-items: center; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Instellingen en export */
.page { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.page > * { max-width: 980px; }
.page h2 { font: 600 22px/1.15 var(--font-display); margin: 0 0 6px; }
.page .lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.namen { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.namen textarea { width: 100%; min-height: 150px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font: 13px/1.5 var(--font-mono); resize: vertical; }
.files { width: 100%; border-collapse: collapse; }
.files th, .files td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
.files th { font-weight: 500; font-size: 12px; color: var(--muted); }
.files td.num { font-variant-numeric: tabular-nums; }
.files td.act { white-space: nowrap; text-align: right; }
.issues { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.issues li button { all: unset; cursor: pointer; display: grid; grid-template-columns: 64px 150px 130px 1fr; gap: 10px; padding: 6px 8px; border-radius: 6px; width: 100%; box-sizing: border-box; }
.issues li button:hover { background: var(--accent-soft); }
.issues .lvl.bad { color: var(--bad); font-weight: 600; }
.issues .lvl.warn { color: var(--warn); font-weight: 600; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin: 0 0 16px; }

.dropzone { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); background: var(--panel); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); width: min(820px, 94vw); }
dialog::backdrop { background: rgba(10, 15, 25, .45); }
dialog .dhead { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
dialog .dhead h3 { margin: 0; font: 600 16px var(--font-body); }
dialog .dbody { padding: 14px 18px; display: grid; gap: 10px; }
dialog textarea { width: 100%; height: 340px; font: 12.5px/1.45 var(--font-mono); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 760px) {
  main { flex-direction: column; }
  .view.active { flex-direction: column; }
  aside.list { width: 100%; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .issues li button { grid-template-columns: 60px 1fr; }
}

/* Vormgeving gelijk aan de webapp (cnx web). Overschrijft de stijl hierboven. */
:root {
  --paper: #f4f6f9; --panel: #fff; --panel2: #f8fafc; --ink: #122033; --ink2: #2b3a4f; --muted: #5f6c7f; --line: #e2e7ee; --line2: #cfd7e2;
  --accent: #2457d6; --accent2: #1c46b0; --accent-soft: #eaf0fd; --onaccent: #fff;
  --bad: #c4312b; --bad-soft: #fdeceb; --warn: #a35d06; --warn-soft: #fdf2e1; --ok: #1f7a4a; --ok-soft: #e4f4ea;
  --shadow: 0 1px 2px rgba(18,32,51,.04), 0 2px 6px rgba(18,32,51,.05); --ring: 0 0 0 3px rgba(36,87,214,.18);
  --font-body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131a; --panel: #161d27; --panel2: #1a2230; --ink: #e7ecf3; --ink2: #c9d2df; --muted: #93a0b4; --line: #253042; --line2: #334157;
    --accent: #7aa2ff; --accent2: #9ab9ff; --accent-soft: #1c2943; --onaccent: #0b1220;
    --bad: #ff7b72; --bad-soft: #3b1f22; --warn: #f0b35a; --warn-soft: #3a2b16; --ok: #56d39a; --ok-soft: #14322a;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --ring: 0 0 0 3px rgba(122,162,255,.25);
  }
}
:root[data-theme="dark"] {
  --paper: #0e131a; --panel: #161d27; --panel2: #1a2230; --ink: #e7ecf3; --ink2: #c9d2df; --muted: #93a0b4; --line: #253042; --line2: #334157;
  --accent: #7aa2ff; --accent2: #9ab9ff; --accent-soft: #1c2943; --onaccent: #0b1220;
  --bad: #ff7b72; --bad-soft: #3b1f22; --warn: #f0b35a; --warn-soft: #3a2b16; --ok: #56d39a; --ok-soft: #14322a;
}
body { font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
.mono { font-size: 12.5px; }
:focus-visible { outline-offset: 2px; }

header.top { min-height: 54px; padding: 0 18px; gap: 6px 18px; align-items: stretch; }
header.top > * { align-self: center; }
header.top h1 { font: 650 15px/1.2 var(--font-body); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
header.top h1::before { content: "CNX"; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, #2457d6, #5b8cff); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
.tabs { align-self: stretch !important; background: transparent; border: 0; padding: 0; border-radius: 0; gap: 2px; }
.tabs button { border-radius: 0; padding: 0 11px; font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s, border-color .12s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: transparent; box-shadow: none; color: var(--accent); border-bottom-color: var(--accent); }
.pill { font-size: 11.5px; font-weight: 650; padding: 1px 9px; line-height: 20px; }
.pill.neutral { background: var(--panel2); border: 0; box-shadow: inset 0 0 0 1px var(--line); }

.btn { min-height: 34px; padding: 0 14px; border-radius: 8px; border-color: var(--line2); font-weight: 550; justify-content: center; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel2); }
.btn.primary { color: var(--onaccent); }
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); filter: none; }
.btn.small { min-height: 28px; padding: 0 10px; border-radius: 7px; }

aside.list { width: 290px; }
.list-tools { padding: 12px 14px; gap: 9px; }
.list-tools input, .table-tools input[type="search"] { min-height: 36px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); padding: 6px 11px; }
.chips button { min-height: 28px; padding: 0 12px; border-color: var(--line2); color: var(--ink2); }
.chips button[aria-pressed="true"] { border-color: var(--accent); font-weight: 650; }
.item { margin: 1px 8px; width: calc(100% - 16px); border: 0; border-radius: 8px; padding: 8px 12px 8px 0; }
.item:hover { background: var(--panel2); }
.item .stripe { border-radius: 3px; margin: 4px 0 4px 4px; }
.item .name { font-size: 13.5px; }
.list-foot { padding: 12px 14px; }

section.editor, .page { padding: 24px 28px 40px; }
.editor-head h2, .page h2 { font: 650 20px/1.2 var(--font-body); letter-spacing: -.01em; }
.group { border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; max-width: 1180px; box-shadow: var(--shadow); }
.page > * { max-width: 1180px; }
.group h3 { font: 650 14.5px/1.3 var(--font-body); }
.fields { gap: 16px 20px; }
.field label { font-weight: 600; font-size: 13.5px; }
.field input, .field select, .field textarea { min-height: 36px; padding: 6px 11px; border-color: var(--line2); border-radius: 8px; transition: border-color .12s, box-shadow .12s; }
.field input:focus, .field select:focus, .field textarea:focus, .list-tools input:focus, .table-tools input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
.field.has-bad input:focus, .field.has-bad select:focus { box-shadow: inset 3px 0 0 var(--bad), var(--ring); }
.toggle { border-radius: 8px; border-color: var(--line2); background: var(--panel2); }
.toggle[aria-pressed="true"] { color: var(--onaccent); }

.table-wrap { padding: 20px 24px; gap: 12px; }
.grid-scroll { border-radius: 10px; }
table.grid th { background: var(--panel2); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 9px 8px; }
table.grid td:last-child { background: var(--panel); }
table.grid input, table.grid select { border-radius: 6px; }
.bulk { border-radius: 10px; padding: 10px 12px; background: var(--panel2); }
.files th { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.namen textarea { border-color: var(--line2); border-radius: 8px; background: var(--panel); }
.issues li button { border-radius: 8px; }
.note { border-radius: 10px; border: 1px solid var(--line); }
.dropzone { border-color: var(--line2); border-radius: 12px; padding: 22px; background: var(--panel2); }
dialog { border-radius: 14px; box-shadow: 0 20px 50px rgba(10,20,40,.25); }
dialog textarea { border-radius: 8px; background: var(--panel2); }
.toast { border-radius: 10px; box-shadow: var(--shadow); }

/* In de webapp toont de bovenbalk van cnx web al de titel */
.ingebed header.top h1, .ingebed header.top > .pill { display: none; }
.ingebed header.top { min-height: 48px; }
</style>
</head>
<body>
<header class="top">
  <h1>CNX Alias-invoer</h1><span class="pill neutral">enkel access switches</span>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-form" data-view="form" aria-selected="true">Per switch</button>
    <button role="tab" id="tab-tabel" data-view="tabel" aria-selected="false">Tabel</button>
    <button role="tab" id="tab-inst" data-view="inst" aria-selected="false">Instellingen</button>
    <button role="tab" id="tab-export" data-view="export" aria-selected="false">Export</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="view active" id="view-form">
    <aside class="list">
      <div class="list-tools">
        <input id="zoek" type="search" placeholder="Zoek op hostname, serial of site" aria-label="Zoek switches">
        <div class="chips">
          <button id="f-alle" aria-pressed="true">Alle</button>
          <button id="f-fout" aria-pressed="false">Met fouten</button>
        </div>
      </div>
      <div class="items" id="items"></div>
      <div class="list-foot">
        <button class="btn primary small" id="nieuw">Nieuwe switch</button>
        <button class="btn small" id="importeer-knop">Importeer CSV</button>
      </div>
    </aside>
    <section class="editor" id="editor"></section>
  </div>

  <div class="view" id="view-tabel">
    <div class="table-wrap">
      <div class="table-tools">
        <input id="tzoek" type="search" placeholder="Filter" aria-label="Filter tabel">
        <label><input type="checkbox" id="tfout"> enkel met fouten</label>
        <div class="pager" id="pager"></div>
      </div>

<script>

// ------------------------------------------------------------------ model

let selectie = S.switches[0] ? S.switches[0].id : null;

function nieuwId() { return "s" + Math.random().toString(36).slice(2, 10); }

}
function laad() {
  try { const t = localStorage.getItem(OPSLAG); if (!t) return null; const s = JSON.parse(t); s.cfg = Object.assign(JSON.parse(JSON.stringify(STANDAARD_CFG)), s.cfg); if (s.cfg.modified !== "Yes") s.cfg.modified = "Yes"; if (!s.cfg.velden.sys_vlan_ip.alias_patroon) s.cfg.velden.sys_vlan_ip = JSON.parse(JSON.stringify(STANDAARD_CFG.velden.sys_vlan_ip)); return s; } catch (e) { return null; }
}
let bewaarTimer = null;
function bewaar() { clearTimeout(bewaarTimer); bewaarTimer = setTimeout(() => { try { localStorage.setItem(OPSLAG, JSON.stringify(S)); } catch (e) {} }, 300); }

// ------------------------------------------------------------------ IP-hulp
function ip4(t) {

}

// ------------------------------------------------------------------ controle
function valideer() {

  const namen = { site_collection: new Set(S.namen.site_collection), site: new Set(S.namen.site), device_group: new Set(S.namen.device_group) };

    lijst.push({ id: s.id, label: s.hostname || s.serial || "(nieuw)", veld, lvl, msg });
  }
  function noteer(soort, waarde, s, veld) { const k = soort + "|" + waarde; (gezien[k] = gezien[k] || []).push([s, veld]); }

      }

  }

      add(s, veld, "bad", (soort === "IP" ? "IP " + w : "hostname") + " ook gebruikt" + (anderen.length ? " door " + [...new Set(anderen)].slice(0, 3).join(", ") : " op deze switch"));
    });

}
function status(s) { const p = V.per[s.id]; if (!p) return "ok"; const all = Object.values(p).flat(); return all.some(x => x.lvl === "bad") ? "bad" : "warn"; }

// ------------------------------------------------------------------ genereren (zelfde uitvoer als cnx alias)
function standaardPrefix() { const p = parseInt(String(S.cfg.standaard_prefix || 24).replace("/", ""), 10); return p > 0 && p <= 32 ? p : 24; }
function metPrefix(v) { v = (v || "").trim(); return !v || v.toUpperCase() === "DHCP" || v.includes("/") ? v : v + "/" + standaardPrefix(); }
function sysAlias(s) { const v = S.cfg.velden.sys_vlan_ip; return (v.alias_patroon || "sys_vlan_ipv4_{vlan}").replace("{vlan}", s.beheer_vlan || v.standaard_vlan || 1); }
function rijenVoor(s) {
  const c = S.cfg.velden, uit = [], add = (sec, kol, naam, inst, w) => uit.push({ sec, kol, naam, inst, w });
  if (s.hostname) add("#System-info", ["hostname"], "hostname", s.systeemprofiel || c.hostname.instance, [s.hostname]);
  if (s.sys_vlan_ip) add("#ALIAS_IPV4_ADDRESS_TYPE", ["ipv4-address"], sysAlias(s), "ALIAS_IPV4_ADDRESS_TYPE", [s.sys_vlan_ip.toUpperCase() === "DHCP" ? "DHCP" : metPrefix(s.sys_vlan_ip)]);
  if (s.mgmt_ip) add("#Interface-management", ["ipv4-static"], "IPv4-address", c.mgmt_ip.instance, [metPrefix(s.mgmt_ip)]);

}
function csvCel(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function csvRij(a) { return a.map(csvCel).join(",") + "\n"; }
function bulkTekst(rijen) {
  const per = new Map(SECTIE_VOLGORDE.map(s => [s, new Map()]));
  for (const r of rijen) {
    const voorgedef = !r.sec.startsWith("#ALIAS_");
    const key = (voorgedef ? r.naam : "") + "|" + r.kol.join(",");
    const m = per.get(r.sec); if (!m.has(key)) m.set(key, { kol: r.kol, items: [] }); m.get(key).items.push(r);
  }

    if (!tabellen.size) continue;
    if (!eerste) t += "\n"; eerste = false;
    t += sec + "\n";
    let i = 0;
    for (const { kol, items } of tabellen.values()) {
      if (i++) t += "\n";
      const kop = sec.startsWith("#ALIAS_") ? ["Alias Name", "Alias Type"] : ["Pre-defined Alias Name", "Instance Name"];
      t += csvRij(kop.concat(BASIS, kol));
      for (const r of items) t += csvRij([r.naam, r.inst].concat(r.basis, r.w));

}
function veilig(s) { return String(s).replace(/[^A-Za-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase(); }
function bestanden() {
  const groepen = new Map();
  for (const s of S.switches) {
    if (s.stack === "ja") continue;
    const k = s.golf || "golf1";
    if (!groepen.has(k)) groepen.set(k, []); groepen.get(k).push({ s, rijen: rijenVoor(s) });
  }
  const max = Number(S.cfg.max_rijen) || 5000, uit = [];
  for (const [k, items] of groepen) {
    const golf = k, fn = FUNCTIE;
    const delen = []; let huidig = [], n = 0;
    for (const it of items) { if (huidig.length && n + it.rijen.length > max) { delen.push(huidig); huidig = []; n = 0; } huidig.push(it); n += it.rijen.length; }
    if (huidig.length) delen.push(huidig);
    delen.forEach((d, i) => {
      const rijen = d.flatMap(x => x.rijen);
      uit.push({ naam: veilig(golf) + "__" + veilig(fn) + (delen.length > 1 ? "__deel" + (i + 1) : "") + ".csv", golf, fn, switches: d.length, rijen: rijen.length, tekst: () => bulkTekst(rijen) });
    });

}
function toestellenCsv() { let t = csvRij(KOLOMMEN); for (const s of S.switches) t += csvRij(KOLOMMEN.map(k => s[k] || "")); return t; }
function configJson() {
  const c = { modified: S.cfg.modified, hostname_regex: S.cfg.hostname_regex, velden: S.cfg.velden };
  return JSON.stringify(c, null, 2) + "\n";
}

// ------------------------------------------------------------------ CSV inlezen
function parseCsv(tekst) {
  tekst = tekst.replace(/^﻿/, "");
  const eersteRegel = tekst.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = (eersteRegel.match(/;/g) || []).length > (eersteRegel.match(/,/g) || []).length ? ";" : ",";
  const rijen = []; let rij = [], cel = "", q = false;
  for (let i = 0; i < tekst.length; i++) {
    const c = tekst[i];
    if (q) { if (c === '"') { if (tekst[i + 1] === '"') { cel += '"'; i++; } else q = false; } else cel += c; }
    else if (c === '"') q = true;
    else if (c === delim) { rij.push(cel); cel = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && tekst[i + 1] === "\n") i++; rij.push(cel); rijen.push(rij); rij = []; cel = ""; }
    else cel += c;
  }

}
// Switchlijst uit Classic Central (Devices > Switches > export). Een rij per switch of stack.
function importeerClassicLijst(rijen, kop, naam) {
  const idx = k => kop.indexOf(k), get = (r, k) => (idx(k) >= 0 ? (r[idx(k)] || "").trim() : "");

    if (!/^AOS-CX/i.test(type)) { overgeslagen.push(host || ser); continue; }
    const isStack = /stack/i.test(type) || !/^[A-Z0-9]{8,14}$/.test(ser);
    const opm = ["uit Classic: " + (get(r, "model") || type) + ", groep " + get(r, "group")];

    else s = S.switches.find(x => x.hostname && x.hostname === host);
    if (!s) { s = legeSwitch(); S.switches.push(s); nieuw++; if (!isStack) s.serial = ser; } else bij++;
    if (isStack) { stacks++; s.stack = "ja"; opm.push("VSF-stack (stack-ID " + get(r, "serial") + "): niet via bulk-upload, manueel instellen"); }
    s.hostname = host || s.hostname;
    s.systeemprofiel = s.systeemprofiel || "sys-system-info-profile";
    s.beheer_vlan = s.beheer_vlan || "";
    s.site = get(r, "site") || s.site;
    s.device_group = get(r, "group") || s.device_group;
    if (!s.site_collection && S.cfg.classic_site_collection) s.site_collection = S.cfg.classic_site_collection;
    s.golf = s.golf && s.golf !== "golf1" ? s.golf : (s.site || "classic");
    if (ip && ip !== "-") {
      const pf = (S.cfg.classic_prefix || "").replace("/", "");
      s.sys_vlan_ip = ip.includes("/") ? ip : (pf ? ip + "/" + pf : ip);
      if (!s.sys_vlan_ip.includes("/")) zonderPrefix++;

    }
    s.opmerking = opm.join(". ");

  if (stacks) m += " " + stacks + " stacks gemarkeerd: niet via bulk-upload.";
  if (zonderPrefix) m += " " + zonderPrefix + " IP's zonder prefix: vul aan via Tabel.";

}
function zoekOfMaak(serial, nieuw) {

  if (!s) { s = legeSwitch(); s.serial = serial; S.switches.push(s); nieuw.n++; }
  return s;
}
function importeer(tekst, naam) {
  const rijen = parseCsv(tekst);
  const isBulk = rijen.some(r => (r[0] || "").startsWith("#"));
  const kop = (rijen.find(r => r.some(c => c)) || []).map(c => c.toLowerCase());
  const telling = { n: 0 }; let bijgewerkt = 0; const andere = new Set();
  if (isBulk) {
    let sectie = null, kopr = null; const namen = { site_collection: new Set(), site: new Set(), device_group: new Set() };
    for (let r of rijen) {

      if (!r.length) { kopr = null; continue; }
      if (r[0].startsWith("#")) { sectie = r[0]; kopr = null; continue; }
      if (r[0] === "Alias Name" || r[0] === "Pre-defined Alias Name") { kopr = r; continue; }
      if (!kopr || !sectie || r.length < 9 || r[0].startsWith("//")) continue;
      const o = {}; kopr.forEach((k, i) => o[k] = r[i] || "");
      for (const [k, kk] of [["site_collection", "Site Collection Name"], ["site", "Site Name"], ["device_group", "Device Group Name"]]) if (o[kk] && o[kk] !== "x") namen[k].add(o[kk]);
      if (o["Scope Level"] !== "Device" || !o["Device"] || o["Device"] === "x") continue;
      if (o["Device Function"] !== FUNCTIE) { andere.add(o["Device"]); continue; }
      const w = kopr.slice(9).map(k => o[k]); if (!w.some(x => x)) continue;
      const naamA = r[0], inst = r[1], cfg = S.cfg.velden;
      const bekend = (sectie === "#System-info" && naamA === "hostname") || (sectie === "#ALIAS_IPV4_ADDRESS_TYPE" && /^sys_vlan_ipv4_\d+$/.test(naamA)) || (sectie === "#Interface-management" && naamA === "IPv4-address");

    const ul = el("ul", { class: "issues" });
    for (const x of V.lijst.slice().sort((a, b) => (a.lvl === "bad" ? 0 : 1) - (b.lvl === "bad" ? 0 : 1)).slice(0, 300))
      ul.append(el("li", {}, el("button", { onclick: () => { selectie = x.id; zetView("form"); } }, el("span", { class: "lvl " + x.lvl }, x.lvl === "bad" ? "FOUT" : "LET OP"), el("span", { class: "mono" }, x.label), el("span", {}, (VELDEN.find(v => v.key === x.veld) || {}).label || x.veld), el("span", {}, x.msg))));
    p.append(el("div", { class: "group" }, el("h3", {}, "Bevindingen (" + V.lijst.length + ")"), ul));
  }
}
function koppelDrop(dz) {
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("over"));
  dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); leesBestanden(e.dataTransfer.files); });
}
async function leesBestanden(files) {
  const meldingen = [];
  for (const f of files) {
    const tekst = await f.text();
    if (/\.json$/i.test(f.name)) {
      try {
        const k = JSON.parse(tekst);
        if (!k.velden) throw new Error("geen velden");
        S.cfg = Object.assign(S.cfg, { modified: k.modified || "Yes", hostname_regex: k.hostname_regex || S.cfg.hostname_regex,
          velden: Object.assign(S.cfg.velden, k.velden) });
        meldingen.push(f.name + ": klantconfig geladen" + (k.klant ? " (" + k.klant + ")" : "") + ".");
      } catch (e) { meldingen.push(f.name + ": geen geldige klantconfig."); }
      continue;
    }
    meldingen.push(importeer(tekst, f.name));
  }
  if (!selectie && S.switches[0]) selectie = S.switches[0].id;
  render(); toast(meldingen.join(" "));
}

// ------------------------------------------------------------------ navigatie
function zetView(v) {
  actieveView = v;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v ? "true" : "false"));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === "view-" + v));
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => zetView(b.dataset.view)));
$("zoek").addEventListener("input", e => { zoek = e.target.value; renderLijst(); });
$("f-alle").addEventListener("click", () => { filterFout = false; $("f-alle").setAttribute("aria-pressed", "true"); $("f-fout").setAttribute("aria-pressed", "false"); renderLijst(); });
$("f-fout").addEventListener("click", () => { filterFout = true; $("f-alle").setAttribute("aria-pressed", "false"); $("f-fout").setAttribute("aria-pressed", "true"); renderLijst(); });
$("nieuw").addEventListener("click", nieuweSwitch);
$("importeer-knop").addEventListener("click", () => $("bestand").click());
$("bestand").addEventListener("change", e => { leesBestanden(e.target.files); e.target.value = ""; });
$("tzoek").addEventListener("input", e => { tabelFilter = e.target.value; tabelPagina = 0; renderTabel(); });
$("tfout").addEventListener("change", e => { tabelFout = e.target.checked; tabelPagina = 0; renderTabel(); });
function inFilter() { const z = tabelFilter.toLowerCase(); return S.switches.filter(s => (!tabelFout || status(s) === "bad") && (!z || TABEL.some(k => (s[k] || "").toLowerCase().includes(z)))); }
$("b-prefix-knop").addEventListener("click", () => {
  const pf = $("b-prefix").value.replace("/", "").trim(); if (!/^\d{1,2}$/.test(pf) || Number(pf) > 32) { toast("Geef een prefix tussen 0 en 32, bijvoorbeeld 24."); return; }
  let n = 0; for (const s of inFilter()) for (const k of ["sys_vlan_ip", "mgmt_ip"]) if (s[k] && s[k].toUpperCase() !== "DHCP" && !s[k].includes("/") && ip4(s[k]) !== null) { s[k] += "/" + pf; n++; }
  S.cfg.classic_prefix = pf; render(); toast("/" + pf + " gezet bij " + n + " IP's.");
});
$("b-sc-knop").addEventListener("click", () => {
  const v = $("b-sc").value.trim(); if (!v) { toast("Vul eerst een site collection in."); return; }
  let n = 0; for (const s of inFilter()) if (!s.site_collection) { s.site_collection = v; n++; }
  S.cfg.classic_site_collection = v; render(); toast("Site collection gezet bij " + n + " switches.");
});
$("b-golf-knop").addEventListener("click", () => {
  const v = $("b-golf").value.trim(); if (!v) { toast("Vul eerst een golf in."); return; }
  const l = inFilter(); l.forEach(s => s.golf = v); render(); toast("Golf " + v + " gezet bij " + l.length + " switches.");
});
$("dlg-sluit").addEventListener("click", () => $("dlg").close());
$("dlg-kopieer").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("dlg-tekst").value); toast("Gekopieerd."); } catch (e) { $("dlg-tekst").select(); toast("Selecteer en kopieer met Ctrl+C."); } });
koppelDrop($("editor"));
render();
</script>
</body>
