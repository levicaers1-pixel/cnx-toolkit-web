# Bouwt het container-image en test het. Bij een tag v* (bv. v0.2.0) komt het op GitHub Container Registry:
#   ghcr.io/levicaers1-pixel/cnx-toolkit-web:0.2.0 en :latest
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bouwen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cnx-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rooktest (alleen-lezen, zonder root)
        run: |
          docker run -d --name cnx --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 8080:8080 -e CNX_HOSTS=localhost cnx-test:latest
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/gezond && break; sleep 1; done
          echo
          curl -fsS http://localhost:8080/gezond | grep -q '"ok": true'
          # de pagina, met een sessiecookie
          curl -fsS -D koppen.txt -o pagina.html http://localhost:8080/
          grep -q "CNX Toolkit" pagina.html
          grep -qi "^set-cookie: cnx_sessie=.*HttpOnly.*SameSite=Strict.*Secure" koppen.txt
          grep -q "const OPSLAG = false;" pagina.html
          # een andere hostnaam wordt geweigerd
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:8080/)" = "403"
          # zonder sessie geen toegang tot de API
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = "401"
          test "$(docker exec cnx id -u)" = "10001"
          docker inspect --format '{{.State.Health.Status}}' cnx
          docker logs cnx
          docker rm -f cnx

      - name: Versie van tag nakijken
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(docker run --rm --entrypoint cnx cnx-test:latest --version | awk '{print $NF}')
          test "v$v" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} past niet bij versie $v"; exit 1; }

      - name: Aanmelden bij GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels en tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Image publiceren
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
