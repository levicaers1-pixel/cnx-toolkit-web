# Bouwt cnx.exe op Windows en maakt een release bij elke tag v*, bv. v1.0.0.
# Ondertekenen gebeurt enkel als de secrets SIGN_PFX_BASE64 en SIGN_PFX_PASSWORD bestaan.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Afhankelijkheden
        run: pip install -e ".[dev]"
      # De standaard-bootloader van PyInstaller (het opstartprogramma in elke onefile-exe) wordt ook door malware
      # gebruikt; virusscanners melden hem daardoor vaak vals. Hier bouwen we hem zelf uit de broncode (MSVC staat op de
      # runner), zelfde PyInstaller-versie. De stap faalt als de bootloader toch de standaardversie gebleven is.
      - name: PyInstaller met eigen bootloader
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $code = "import PyInstaller, os, hashlib; p = os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'run.exe'); print(hashlib.sha256(open(p, 'rb').read()).hexdigest())"
          $v = python -c "import PyInstaller; print(PyInstaller.__version__)"
          $voor = python -c $code
          pip uninstall -y pyinstaller
          pip install --no-binary pyinstaller --no-cache-dir "pyinstaller==$v"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller $v uit de broncode installeren mislukt" }
          $na = python -c $code
          "PyInstaller $v, bootloader run.exe: standaard $voor, eigen build $na"
          if ($voor -eq $na) { throw "De bootloader is niet opnieuw gebouwd" }
      - name: Versie van tag nakijken
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import cnx_api; print(cnx_api.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} past niet bij __version__ $v" }
      - run: python build/maak.py leesmij
      - run: python build/maak.py versie
      - run: pyinstaller --noconfirm --clean build/cnx.spec
      - name: Ondertekenen (optioneel)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\cnx.exe
          Remove-Item cert.pfx
      - name: Rooktest
        run: |
          dist\cnx.exe --version
          dist\cnx.exe alias --help
          dist\cnx.exe api --help
          dist\cnx.exe web --help
      - run: python build/maak.py zip
      - uses: actions/upload-artifact@v7
        with:
          name: CNX-Toolkit
          path: dist/CNX-Toolkit-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CNX-Toolkit-*.zip
          body_path: CHANGELOG.md
